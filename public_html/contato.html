<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/contato.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header>
      <a href="./index.html">
          <div class="logo">
              <img src="img/logopreta.PNG" alt="Logo">
          </div>
      </a>

      <div class="mobile-menu">
          <div class="line1"></div>
          <div class="line2"></div>
          <div class="line3"></div>
      </div>

      <nav>
        <ul class="nav-list">
          <li class="logo-item">
            <a href="./index.html">
              <div class="logo">
                <img src="img/logopreta.PNG" alt="Logo">
              </div>
            </a>
          </li>
          <li><a href="./projetos.html">Projetos</a></li>
          <li><a href="./obras.html">Obras Concluídas</a></li>
          <li><a href="./sobrenos.html">Sobre nós</a></li>
          <li><a href="./contato.html">Contato</a></li>
        </ul>
      </nav>
  </header>
    <!--Final do Cabeçalho-->

    <div class="container">
        <div class="left">
          <img src="./img/obras/cozinhamineira-capa.jpg" alt="Imagem de exemplo">
        </div>
        <div class="right">
        <h2>Entre em contato conosco:</h2>  
          <form action="https://formspree.io/f/SEU_FORM_ID" method="POST" id="contactForm">
            <input type="text" name="nome" placeholder="Nome completo" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="tel" name="telefone" placeholder="Telefone" required>
            <textarea name="mensagem" placeholder="Mensagem"></textarea>
            <button type="submit">Enviar</button>
          </form>
          <div id="formMessage"></div>
          <div class="buttons">
            <a href="https://api.whatsapp.com/send?phone=seu_numero_de_telefone" target="_blank">
              <div class="whatsapp">
                <img class="whatsapp-logo" src="./img/whatsApp-Logo.png" alt="Ícone do WhatsApp">
                <span>Contato via Whatsapp</span>
              </div>
            </a>
            <a href="https://www.instagram.com/studiocataarquitetura/" target="_blank">
              <div class="instagram">
                <img src="./img/instagram-logo.png" alt="Ícone do Instagram">
                <span>Conheça nosso Instagram</span>
              </div>
            </a>
          </div>
        </div>
      </div>
      <script src="./js/header.js"></script>
      <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
          const button = this.querySelector('button[type="submit"]');
          const originalText = button.textContent;
          button.textContent = 'Enviando...';
          button.disabled = true;
          
          const messageDiv = document.getElementById('formMessage');
          messageDiv.innerHTML = '<p style="color: blue;">Enviando mensagem...</p>';
          
          // O formulário será enviado automaticamente pelo Formspree
          // Após o envio, o usuário será redirecionado para uma página de sucesso
        });
      </script>
</body>
</html>
